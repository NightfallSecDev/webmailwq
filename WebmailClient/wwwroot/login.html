<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LETTERDUCK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-canvas), #111116);
            /* Animated background subtle effect */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, var(--bg-canvas), #F3F4F6);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-glass);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing orb effect behind the form */
        .auth-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--brand-action) 0%, transparent 70%);
            opacity: 0.15;
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header .brand {
            font-size: 2rem;
            justify-content: center;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--brand-action);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .advanced-settings-toggle {
            display: block;
            text-align: center;
            color: var(--brand-action);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .advanced-settings-toggle:hover {
            text-decoration: underline;
        }

        .advanced-settings {
            display: none;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        .advanced-settings.open {
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--brand-action);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-md);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--brand-action-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .theme-toggle-floating {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <button class="theme-toggle theme-toggle-floating" id="theme-toggle" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand"><img src="logo.png" class="brand-logo" alt="Logo"> <span class="brand-text">LETTERDUCK</span></div>
            <p>Sign in to your encrypted workspace</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">App Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <a class="advanced-settings-toggle" id="advanced-toggle">Show IMAP/SMTP Settings</a>

            <div class="advanced-settings" id="advanced-settings">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="imap-server">IMAP Server</label>
                        <input type="text" id="imap-server" class="form-control" placeholder="imap.example.com">
                    </div>
                    <div class="form-group">
                        <label for="imap-port">IMAP Port</label>
                        <input type="number" id="imap-port" class="form-control" placeholder="993" value="993">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="smtp-server">SMTP Server</label>
                        <input type="text" id="smtp-server" class="form-control" placeholder="smtp.example.com">
                    </div>
                    <div class="form-group">
                        <label for="smtp-port">SMTP Port</label>
                        <input type="number" id="smtp-port" class="form-control" placeholder="465" value="465">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Connect Mailbox</button>
        </form>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        });

        const advancedToggle = document.getElementById('advanced-toggle');
        const advancedSettings = document.getElementById('advanced-settings');

        advancedToggle.addEventListener('click', () => {
            advancedSettings.classList.toggle('open');
            advancedToggle.textContent = advancedSettings.classList.contains('open') 
                ? 'Hide IMAP/SMTP Settings' 
                : 'Show IMAP/SMTP Settings';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Extract optional advanced IMAP/SMTP settings
            const imapServer = document.getElementById('imap-server').value;
            const imapPort = parseInt(document.getElementById('imap-port').value || '993');
            const smtpServer = document.getElementById('smtp-server').value;
            const smtpPort = parseInt(document.getElementById('smtp-port').value || '465');

            const result = await API.login(email, password, imapServer, imapPort, smtpServer, smtpPort);
            if (result) {
                // In a real app, save result.AccountId or JWT to localStorage
                localStorage.setItem('accountId', result.accountId || 1);
                window.location.href = 'index.html';
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                // Show error if login failed
                if (result === false) {
                    alert('Invalid credentials.');
                } else if (result && result.error) {
                    alert(result.error);
                }
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script src="api-client.js"></script>
</body>
</html>
